version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tele-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botpass}
      POSTGRES_DB: ${POSTGRES_DB:-tele_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botuser} -d ${POSTGRES_DB:-tele_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"  # Map host port 5433 to container port 5432 (to avoid conflicts with other projects)

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tele-assistant-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Mount credentials and token
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-botuser}:${POSTGRES_PASSWORD:-botpass}@postgres:5432/${POSTGRES_DB:-tele_assistant}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows access to host machine from container
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

